<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Reflection | The Living Word</title>
    <link rel="stylesheet" href="church.css">
    <link rel="stylesheet" href="/site-navigation.css">
    <style>
        .reflection-page { min-height: 100vh; background: radial-gradient(circle at 90% 0, #e5eee2, transparent 34%), var(--paper); }
        .page-header { padding: 22px 0; border-bottom: 1px solid var(--line); background: rgba(255, 254, 250, .86); }
        .page-nav { display: flex; justify-content: space-between; align-items: center; gap: 18px; }
        .back-link { color: var(--deep-sage); font-size: 13px; font-weight: 700; text-decoration: none; }
        .reflection-main { width: min(1400px, calc(100% - 48px)); max-width: 1400px; padding: 58px 0 90px; }
        .reflection-title-band { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: 28px; }
        .reflection-title-band h1 { margin: 10px 0 0; font-size: clamp(42px, 6vw, 68px); }
        .lead { max-width: 470px; margin: 0 0 6px; color: var(--muted); font-size: 16px; }
        .reflection-card { display: grid; grid-template-columns: minmax(300px, .82fr) minmax(0, 1.18fr); max-width: none; min-height: 620px; padding: 0; overflow: hidden; border: 1px solid var(--line); background: var(--white); box-shadow: var(--shadow); }
        .reflection-reading-pane { display: flex; flex-direction: column; justify-content: center; padding: clamp(28px, 4vw, 58px); color: var(--white); background: linear-gradient(155deg, #21473d, #315a4d 70%, #496958); }
        .reflection-reading-pane .eyebrow { color: #e3c17e; }
        .reflection-reading-pane h2 { margin: 12px 0 18px; color: var(--white); font: 600 clamp(30px, 3.4vw, 46px)/1.12 "Playfair Display", serif; }
        .reflection-reading-pane > p:not(.reflection-prompt) { color: rgba(255, 254, 250, .82); font-size: 16px; line-height: 1.8; }
        .reflection-prompt { padding: 21px 23px; margin: 18px 0 0; border-left: 3px solid #e3c17e; color: var(--ink) !important; background: #fffaf0; font: 20px/1.55 "Playfair Display", serif; }
        .reflection-writing-pane { display: grid; grid-template-rows: auto 1fr auto; gap: 14px; min-width: 0; padding: clamp(24px, 4vw, 54px); background: var(--white); }
        .reflection-writing-pane label { margin: 0; color: var(--ink); font: 600 20px "Playfair Display", serif; }
        .reflection-card textarea { width: 100%; min-height: 390px; padding: 6px 10px 0 0; resize: vertical; border: 0; border-radius: 0; outline: none; color: var(--ink); background-color: transparent; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--line) 32px); background-size: 100% 32px; font: 15px/32px "DM Sans", sans-serif; }
        .reflection-card textarea:focus-visible { box-shadow: inset 0 -2px 0 var(--gold); }
        .reflection-writing-pane .journal-footer { padding-top: 13px; border-top: 1px solid var(--line); }
        @media (max-width: 760px) { .reflection-main { width: min(100% - 28px, 600px); padding: 38px 0 70px; } .reflection-title-band { align-items: flex-start; flex-direction: column; gap: 12px; } .reflection-title-band h1 { font-size: 42px; } .reflection-card { grid-template-columns: 1fr; min-height: 0; } .reflection-reading-pane { min-height: 310px; padding: 28px 24px; } .reflection-reading-pane h2 { font-size: 32px; } .reflection-writing-pane { min-height: 390px; padding: 24px 20px; } .reflection-card textarea { min-height: 245px; } }
    </style>
</head>
<body class="reflection-page">
    <header class="page-header"><div class="shell" data-site-navigation data-current-page="reflection"></div></header>
    <main class="shell reflection-main">
        <section class="reflection-title-band"><div><span class="eyebrow">A quiet daily practice</span><h1>Daily Reflection</h1></div><p class="lead">Read slowly, notice what is present, and write honestly. Your reflection page is private and stays on this device.</p></section>
        <article class="reflection-card">
            <section class="reflection-reading-pane"><span class="eyebrow" id="reflection-date"></span><h2 id="reflection-title"></h2><p id="reflection-text"></p><p class="reflection-prompt" id="reflection-prompt"></p></section>
            <section class="reflection-writing-pane"><label for="daily-note">Your page for today</label><textarea id="daily-note" placeholder="What are you learning today?&#10;&#10;A prayer, a question, or one step you want to take..."></textarea><div class="journal-footer"><span class="saved" id="reflection-status" aria-live="polite"></span><button class="button" id="save-daily-note" type="button">Save reflection</button></div></section>
        </article>
    </main>
    <footer><div class="shell">THE LIVING WORD · One honest moment at a time.</div></footer>
    <script>
        const reflections = [
            ['Receiving peace', 'Peace does not mean that every problem is solved. It means you can bring today into God’s care one concern at a time.', 'What worry can you release before the day continues?'],
            ['Choosing courage', 'God can guide you through a small next step. You do not have to understand the whole path before you begin.', 'Where are you being invited to act with courage?'],
            ['Living with gratitude', 'Gratitude helps us notice the gifts that are already present: breath, people, provision, work, and another opportunity to grow.', 'Name three things you received today.'],
            ['Growing in wisdom', 'Wisdom often sounds quiet. It may be the patient answer, the honest choice, or the humility to ask someone for help.', 'What wise choice can you practice today?'],
            ['Offering encouragement', 'Your words can become shelter for someone else. A sincere message may strengthen a person more than you realize.', 'Who can you encourage with specific, kind words?']
        ];
        const today = new Date();
        const reflection = reflections[(today.getDate() - 1) % reflections.length];
        document.querySelector('#reflection-date').textContent = new Intl.DateTimeFormat('en', { weekday: 'long', month: 'long', day: 'numeric' }).format(today);
        document.querySelector('#reflection-title').textContent = reflection[0];
        document.querySelector('#reflection-text').textContent = reflection[1];
        document.querySelector('#reflection-prompt').textContent = reflection[2];
        const note = document.querySelector('#daily-note');
        const status = document.querySelector('#reflection-status');
        note.value = localStorage.getItem('daily-reflection-note') || '';
        document.querySelector('#save-daily-note').addEventListener('click', () => { localStorage.setItem('daily-reflection-note', note.value); status.textContent = 'Reflection saved on this device'; setTimeout(() => status.textContent = '', 2500); });
    </script>
    <script type="module" src="/src/siteNavigation.js"></script>
</body>
</html>
